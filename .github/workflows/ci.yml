name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n 1 php -l
      - name: Standalone regression checks (Totara APIs doubled)
        run: php tests/unit.php
      - name: Package
        run: ./scripts/package.sh /tmp/guardlms-totara-0.1.0.zip
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.2'
        with:
          name: guardlms-totara-alpha
          path: /tmp/guardlms-totara-0.1.0.zip
